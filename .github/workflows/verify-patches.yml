name: Verify U-Boot patches (NanoPi R3S)

on:
  workflow_dispatch:
    inputs:
      uboot_ref:
        description: 'U-Boot tag/branch/commit to check patches against'
        required: true
        default: 'v2025.10'
  push:
    paths:
      - 'patches/uboot-rockchip/**'
      - '.github/workflows/verify-patches.yml'

env:
  PATCH_DIR: patches/uboot-rockchip
  # метки device-tree, которые чаще всего затрагиваются патчами загрузки с SD/eMMC.
  # список можно расширять при добавлении новых .dtsi-патчей.
  DT_LABELS_TO_CHECK: >-
    sdmmc0 sdmmc0_bus4 sdmmc0_clk sdmmc0_cmd sdmmc0_det
    sdhci vcc3v3_sys vccio_sd

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo (нужны только патчи)
        uses: actions/checkout@v4

      - name: List patches to verify
        run: |
          if [ ! -d "${PATCH_DIR}" ]; then
            echo "::error::Directory ${PATCH_DIR} not found"
            exit 1
          fi
          shopt -s nullglob
          patches=("${PATCH_DIR}"/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "::error::No .patch files found in ${PATCH_DIR}"
            exit 1
          fi
          echo "Found ${#patches[@]} patch(es):"
          printf '  %s\n' "${patches[@]}"

      - name: Validate unified diff format (before cloning U-Boot)
        run: |
          echo "Проверяем базовый синтаксис unified diff — заголовок хука должен"
          echo "содержать диапазон строк '@@ -N,M +N,M @@', а не только имя функции."
          FAIL=0
          for p in "${PATCH_DIR}"/*.patch; do
            echo "::group::format-check: ${p}"
            bad_hunks=$(grep -n '^@@' "${p}" | grep -vE '^[0-9]+:@@ -[0-9]+(,[0-9]+)? \+[0-9]+(,[0-9]+)? @@' || true)
            if [ -n "$bad_hunks" ]; then
              echo "::error::${p} has malformed hunk header(s) — missing '-N,M +N,M' line range:"
              echo "$bad_hunks"
              FAIL=1
            fi
            if ! grep -q '^@@' "${p}"; then
              echo "::error::${p} has no '@@' hunk header at all — not a valid unified diff"
              FAIL=1
            fi
            echo "::endgroup::"
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::One or more patches are not valid unified diffs — fix them before proceeding (see 'git diff' to regenerate correctly)"
            exit 1
          fi

      - name: Clone U-Boot (${{ inputs.uboot_ref || 'v2025.10' }})
        run: |
          REF="${{ inputs.uboot_ref }}"
          REF="${REF:-v2025.10}"
          echo "UBOOT_REF=${REF}" >> "$GITHUB_ENV"
          git clone --branch "${REF}" --depth 1 \
            https://source.denx.de/u-boot/u-boot.git uboot

      - name: Install dtc (for optional dtb sanity check)
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler

      - name: Debug — show target files as they exist upstream
        run: |
          echo "Показываем содержимое файлов, которые патчи собираются менять,"
          echo "чтобы визуально сверить контекст (whitespace, структура, путь)."
          for p in "${PATCH_DIR}"/*.patch; do
            echo "::group::debug: ${p}"
            # извлекаем пути 'a/...' из заголовков диффа
            targets=$(grep -E '^--- a/' "${p}" | sed 's#^--- a/##')
            for t in $targets; do
              echo "--- expected path: ${t} ---"
              if [ -f "uboot/${t}" ]; then
                echo "FILE EXISTS. Content (cat -A, first 40 lines):"
                cat -A "uboot/${t}" | head -40
              else
                echo "FILE DOES NOT EXIST at this path in ${UBOOT_REF}"
              fi
              echo "--- searching for similarly named files anywhere in tree ---"
              base=$(basename "${t}")
              # ищем по значимой части имени (без -u-boot.dtsi/.dts суффикса тоже)
              stem=$(echo "$base" | sed -E 's/-u-boot\.dtsi$//; s/\.dts(i)?$//')
              find uboot -iname "*${stem}*" 2>/dev/null
            done
            echo "::endgroup::"
          done

      - name: Debug — show shared rk356x-u-boot.dtsi and board dts
        run: |
          echo "Смотрим общий (не board-specific) -u-boot.dtsi, который подключается"
          echo "через #include в патченном файле — spl-boot-order может быть уже там,"
          echo "и тогда патчу нужно ПЕРЕОПРЕДЕЛИТЬ свойство, а не добавлять новый блок chosen."
          echo ""
          echo "::group::rk356x-u-boot.dtsi (shared)"
          shared=$(find uboot -iname 'rk356x-u-boot.dtsi' | head -n1)
          if [ -n "$shared" ]; then
            echo "found at: $shared"
            cat -A "$shared"
          else
            echo "NOT FOUND anywhere in tree"
          fi
          echo "::endgroup::"

          echo "::group::search 'spl-boot-order' anywhere in dts tree"
          grep -rn 'spl-boot-order' uboot/arch/arm/dts/ uboot/dts/ 2>/dev/null \
            || echo "'spl-boot-order' not found anywhere — this mechanism may not be used for this board/version at all"
          echo "::endgroup::"

          echo "::group::main board dts (rk3566-nanopi-r3s.dts) — mmc/sdhci node names"
          board_dts=$(find uboot -iname 'rk3566-nanopi-r3s.dts' | head -n1)
          if [ -n "$board_dts" ]; then
            echo "found at: $board_dts"
            grep -n -B2 -A2 'sdmmc\|sdhci\|mmc@' "$board_dts"
          else
            echo "NOT FOUND"
          fi
          echo "::endgroup::"

          echo "::group::shared rk356x.dtsi / rk3566.dtsi — mmc controller labels"
          for f in $(find uboot -iname 'rk356x.dtsi' -o -iname 'rk3566.dtsi'); do
            echo "--- $f ---"
            grep -n -B1 'mmc@\|sdhci' "$f" || echo "(no matches in this file)"
          done
          echo "::endgroup::"

      - name: Apply-check each patch (git apply --check)
        continue-on-error: true
        run: |
          set -o pipefail
          FAIL=0
          for p in "${PATCH_DIR}"/*.patch; do
            echo "::group::apply-check: ${p}"
            if git -C uboot apply --check --verbose "../${p}"; then
              echo "OK: ${p} applies cleanly"
            else
              echo "::error::${p} does NOT apply cleanly against ${UBOOT_REF}"
              FAIL=1
            fi
            echo "::endgroup::"
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "APPLY_CHECK_FAILED=1" >> "$GITHUB_ENV"
          fi

      - name: Fuzzy apply attempt (diagnostic only, does not fail the job)
        if: env.APPLY_CHECK_FAILED == '1'
        run: |
          echo "apply --check провалился выше. Пробуем fuzzy-match через patch(1),"
          echo "чтобы понять, насколько сильно контекст разошёлся."
          cd uboot
          for p in ../"${PATCH_DIR}"/*.patch; do
            echo "::group::fuzzy: ${p}"
            patch -p1 --fuzz=3 --dry-run < "${p}" || true
            echo "::endgroup::"
          done
          cd ..
          echo "::error::One or more patches failed clean apply-check — see 'Debug' and 'Fuzzy apply' output above for details"
          exit 1

      - name: Apply patches for real (temp working tree)
        if: env.APPLY_CHECK_FAILED != '1'
        run: |
          for p in "${PATCH_DIR}"/*.patch; do
            echo "Applying ${p}"
            git -C uboot apply "../${p}"
          done

      - name: Check referenced device-tree labels exist upstream
        if: env.APPLY_CHECK_FAILED != '1'
        run: |
          echo "Проверяем, что метки, на которые ссылаются патчи, реально существуют"
          echo "в device-tree дереве rockchip (за пределами самого патченного файла)."
          FAIL=0
          for label in ${DT_LABELS_TO_CHECK}; do
            echo "--- ${label} ---"
            hits=$(grep -rln "${label}:" uboot/arch/arm/dts/ 2>/dev/null \
                   | grep -v 'nanopi-r3s-u-boot\.dtsi' || true)
            if [ -z "$hits" ]; then
              echo "::warning::label '${label}' not found outside the patched file — verify it exists upstream"
            else
              echo "found in:"
              echo "$hits"
            fi
          done

      - name: Check bootph-* property support in this U-Boot version
        run: |
          echo "Патчи используют bootph-pre-ram / bootph-some-ram (актуальный синтаксис)."
          echo "Если версия U-Boot старая, может потребоваться u-boot,dm-pre-reloc."
          if grep -rq 'bootph-pre-ram' uboot/doc/ uboot/include/ 2>/dev/null; then
            echo "OK: bootph-pre-ram syntax is supported in ${UBOOT_REF}"
          else
            echo "::warning::bootph-pre-ram not referenced in docs/includes — this U-Boot version may expect the older u-boot,dm-pre-reloc syntax instead"
          fi

      - name: Sanity build check — compile board dtb only
        if: env.APPLY_CHECK_FAILED != '1'
        continue-on-error: true
        run: |
          echo "Пытаемся собрать только dtb для платы, без полной сборки U-Boot."
          echo "Это best-effort шаг: если defconfig недоступен в этом дереве, шаг будет пропущен с предупреждением."
          cd uboot
          if [ -f configs/nanopi-r3s-rk3566_defconfig ]; then
            make nanopi-r3s-rk3566_defconfig
            make -j"$(nproc)" arch/arm/dts/rk3566-nanopi-r3s-u-boot.dtb 2>&1 | tail -n 60
          else
            echo "::warning::configs/nanopi-r3s-rk3566_defconfig not found in this U-Boot ref — skipping build check"
          fi

      - name: Summary
        if: always()
        run: |
          echo "Проверка патчей завершена для U-Boot ref: ${UBOOT_REF}"
          echo "Если выше есть ::error:: — патч не применяется или ссылается на несуществующие метки."
          echo "::warning:: — не блокирует, но требует ручной проверки перед мержем в основной build workflow."
