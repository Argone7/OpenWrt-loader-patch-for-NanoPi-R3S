name: Build U-Boot (NanoPi R3S LTS)

on:
  workflow_dispatch:
  push:
    paths:
      - 'patches/uboot-rockchip/**'
      - '.github/workflows/build-uboot.yml'

env:
  OPENWRT_TAG: v25.12.5
  DEVICE_PROFILE: friendlyarm_nanopi-r3s

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo (нужны только патчи)
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev \
            file wget
            
      - name: Clone OpenWrt ${{ env.OPENWRT_TAG }}
        run: |
          git clone --branch "${OPENWRT_TAG}" --depth 1 \
            https://github.com/openwrt/openwrt.git openwrt
            
      - name: Cache downloads and toolchain
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir/host
            openwrt/staging_dir/toolchain-*
          key: ${{ runner.os }}-owrt-${{ env.OPENWRT_TAG }}-${{ env.DEVICE_PROFILE }}

#      - name: Inject custom u-boot patches
#        run: |
#          mkdir -p openwrt/package/boot/uboot-rockchip/patches
#          cp patches/uboot-rockchip/*.patch \
#             openwrt/package/boot/uboot-rockchip/patches/

      - name: Feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Minimal .config (только цель rockchip/armv8)
        working-directory: openwrt
        run: |
          cat > .config <<EOF
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_${DEVICE_PROFILE}=y
          EOF
          make defconfig

      - name: Download package sources
        working-directory: openwrt
        run: make download -j$(nproc)

      - name: Build toolchain
        working-directory: openwrt
        run: make toolchain/install -j$(nproc) V=s

      - name: Build ARM Trusted Firmware (BL31, зависимость u-boot для RK3568)
        working-directory: openwrt
        run: make package/boot/arm-trusted-firmware-rockchip/compile -j$(nproc) V=s

      - name: Build U-Boot only
        working-directory: openwrt
        run: make package/boot/uboot-rockchip/{clean,compile} -j$(nproc) V=s

      - name: Locate resulting files
        working-directory: openwrt
        run: |
          echo "--- idbloader ---"
          find staging_dir build_dir -iname '*idbloader*.img'
          echo "--- u-boot.itb ---"
          find staging_dir build_dir -iname 'u-boot*.itb'

      - name: Collect artifacts
        run: |
          mkdir -p out
          IDB=$(find openwrt/staging_dir -iname '*idbloader*.img' | head -n1)
          ITB=$(find openwrt/staging_dir -iname 'u-boot*.itb' | head -n1)
          cp "$IDB" out/idbloader.img
          cp "$ITB" out/u-boot.itb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nanopi-r3s-lts-uboot
          path: out/
