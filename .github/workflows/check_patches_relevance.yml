name: Check U-Boot patch relevance

on:
  workflow_dispatch:
    inputs:
      uboot_tag:
        description: 'U-Boot tag/version'
        required: true
        default: 'v2025.10'

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone U-Boot ${{ inputs.uboot_tag }}
        run: |
          git clone --branch "${{ inputs.uboot_tag }}" --depth 1 \
            https://source.denx.de/u-boot/u-boot.git uboot

      - name: Show function signature containing target logic
        working-directory: uboot
        run: |
          sed -n '180,340p' common/spl/spl_fit.c

      - name: Check get_table_entry_id (image.c)
        working-directory: uboot
        run: |
          echo "=== get_table_entry_id ==="
          grep -n -A10 'int get_table_entry_id' boot/image.c common/image.c 2>/dev/null \
            || echo "NOT FOUND — pattern changed or moved"
